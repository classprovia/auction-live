<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin Control</title>
  <style>
    body {
      font-family: Arial;
      background: #f3f4f6;
      padding: 30px;
      direction: rtl;
      text-align: right;
    }
    .card {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    }
    input {
      width: 100%;
      padding: 12px;
      margin-top: 12px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 20px;
    }
    button {
      width: 100%;
      padding: 15px;
      margin-top: 20px;
      background: #2563eb;
      border: none;
      color: white;
      font-size: 22px;
      border-radius: 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="card">
  <h2>لوحة التحكم - تحديث البيانات</h2>

  <label>العنوان</label>
  <input id="title">

  <label>القيمة الأسمية</label>
  <input id="nominal">

  <label>القيمة الحالية</label>
  <input id="current">

  <button id="save">حفظ</button>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.6.0/firebase-app.js";
  import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.6.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCW0TfoVoGt-V73gCDwiEbvtmObClew6M0",
    authDomain: "riyadh-motoshow.firebaseapp.com",
    projectId: "riyadh-motoshow",
    storageBucket: "riyadh-motoshow.firebasestorage.app",
    messagingSenderId: "524282460328",
    appId: "1:524282460328:web:1fa50981ae562d8f4eaa9d",
    measurementId: "G-0SQK5V42CM"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const ref = doc(db, "auction", "values");

  (async () => {
    const snap = await getDoc(ref);
    if (snap.exists()) {
      const d = snap.data();
      document.getElementById("title").value = d.title || "";
      document.getElementById("nominal").value = d.nominal || "";
      document.getElementById("current").value = d.current || "";
    }
  })();

  document.getElementById("save").onclick = async () => {
    await setDoc(ref, {
      title: document.getElementById("title").value,
      nominal: document.getElementById("nominal").value,
      current: document.getElementById("current").value
    }, { merge: true });

    alert("تم حفظ البيانات بنجاح — التحديث ظهر Live");
  };
</script>

</body>
</html>
