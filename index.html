<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>RIYADH MOTORSHOW LIVE</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: white;
      font-family: "Segoe UI", Tahoma, Arial;
      direction: rtl;
      text-align: right;
    }

    .container {
      width: 100%;
      max-width: 1200px;
      margin: auto;
      padding: 40px;
    }

    .title {
      font-size: 48px;
      font-weight: bold;
      color: black;
      margin-bottom: 40px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      gap: 40px;
      margin-top: 20px;
    }

    .box {
      flex: 1;
      padding: 40px;
      border: 2px solid #222;
      border-radius: 15px;
      background: #f4f4f4;
    }

    .label {
      font-size: 32px;
      font-weight: 600;
      color: black;
      margin-bottom: 20px;
    }

    .value {
      font-size: 64px;
      font-weight: bold;
      color: #000;
    }

    @media(max-width:900px){
      .row { flex-direction: column; }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="title" id="title">المزاد الخاص بمعرض الرياض للسيارت</div>

    <div class="row">
      <div class="box">
        <div class="label">القيمة الأسمية</div>
        <div class="value" id="nominal">--</div>
      </div>

      <div class="box">
        <div class="label">القيمة الحالية</div>
        <div class="value" id="current">--</div>
      </div>
    </div>

  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.6.0/firebase-app.js";
    import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.6.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCW0TfoVoGt-V73gCDwiEbvtmObClew6M0",
      authDomain: "riyadh-motoshow.firebaseapp.com",
      projectId: "riyadh-motoshow",
      storageBucket: "riyadh-motoshow.firebasestorage.app",
      messagingSenderId: "524282460328",
      appId: "1:524282460328:web:1fa50981ae562d8f4eaa9d",
      measurementId: "G-0SQK5V42CM"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const ref = doc(db, "auction", "values");

    onSnapshot(ref, snap => {
      if (!snap.exists()) return;

      const d = snap.data();

      document.getElementById("title").innerText = d.title || "";
      document.getElementById("nominal").innerText = d.nominal || "--";
      document.getElementById("current").innerText = d.current || "--";
    });
  </script>

</body>
</html>
